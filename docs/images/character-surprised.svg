<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="w-full h-full overflow-visible">
  <defs>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B3848"/>
      <stop offset="85%" stop-color="#0B1B23"/>
      <stop offset="100%" stop-color="#071015"/>
    </radialGradient>
    <filter id="crownShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
    </pattern>
  </defs>
  <ellipse cx="120" cy="225" rx="72" ry="12" fill="rgba(0,0,0,0.22)"/>
  <g id="feet">
    <path d="M 75 195 C 62 195, 55 208, 62 220 C 68 226, 85 226, 92 220 C 96 210, 90 195, 75 195 Z" fill="#0B1B23"/>
    <path d="M 165 195 C 150 195, 144 210, 148 220 C 155 226, 172 226, 178 220 C 185 208, 178 195, 165 195 Z" fill="#0B1B23"/>
  </g>
  <g id="monitor-body">
    <rect x="38" y="40" width="164" height="146" rx="34" fill="#0B1B23"/>
    <rect x="44" y="46" width="152" height="134" rx="28" fill="#F4F1E9"/>
    <rect x="56" y="58" width="128" height="108" rx="20" fill="#0B1B23"/>
    <rect x="62" y="64" width="116" height="96" rx="16" fill="url(#screenGlow)"/>
    <rect x="62" y="64" width="116" height="96" rx="16" fill="url(#scanlines)" opacity="0.4"/>
    <path d="M 68 72 C 78 72, 95 76, 105 84 C 95 82, 80 82, 70 88 C 68 84, 68 76, 68 72 Z" fill="rgba(255,255,255,0.18)"/>
  </g>
  <g id="crown" filter="url(#crownShine)">
    <path d="M 98 42 L 86 18 L 108 26 L 120 10 L 132 26 L 154 18 L 142 42 Z" fill="#FFC857" stroke="#0B1B23" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="120" cy="24" r="3" fill="#FF4B3A"/>
    <circle cx="100" cy="30" r="2.5" fill="#3DDC84"/>
    <circle cx="140" cy="30" r="2.5" fill="#3DDC84"/>
  </g>
  <!-- Face: surprised expression -->
  <g id="face">
    <rect x="84" y="90" width="14" height="20" rx="4" fill="#3DDC84"/>
    <rect x="142" y="90" width="14" height="20" rx="4" fill="#3DDC84"/>
    <circle cx="120" cy="130" r="9" fill="#3DDC84"/>
  </g>
</svg>
