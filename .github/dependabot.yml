# Packages that must move together are grouped: a lone react without react-dom, or @tailwindcss/vite without
# tailwindcss, builds fine but breaks at run time or drifts apart; @vitejs/plugin-react follows vite's major.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vite:
        patterns: ['vite', '@vitejs/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
    ignore:
      # The site builds on Node 22 (CI and Pages); types for a newer Node would promise APIs that are not there.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
