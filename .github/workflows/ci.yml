# Runs on every push (any branch except gh-pages) and every pull request:
#   depersonalization scan | static checks (parse, BOM, versions) | Pester tests in two shards | website build
#   -> package build + integrity -> (main only) GitHub Pages deploy of the website built above
# The website goes live only when everything is green; it used to deploy on its own before any test ran.
# The kit targets Windows PowerShell 5.1, so static checks, tests and packaging run with "shell: powershell"
# (Windows PowerShell 5.1 and the Pester 3.4 that ships with Windows, exactly like tests\Run-Tests.ps1 expects).
name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  depersonalization:
    name: Depersonalization scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for personal or machine-specific data
        shell: pwsh
        run: ./tools/Test-Depersonalized.ps1

  static:
    name: Static checks (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse, encoding and version checks
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          .\tools\Test-KitSyntax.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Every test folder belongs to a test shard
        shell: powershell
        run: |
          # Keep in sync with the tests matrix below; tests\local and the fixtures are not part of CI.
          $sharded = 'core', 'api', 'output', 'arcade', 'pinball', 'lightgun', 'gui', 'pads'
          $missing = @(Get-ChildItem tests -Directory | Where-Object { $_.Name -notin $sharded + 'local', 'fixtures', 'fixtures-local' })
          if ($missing) { Write-Error "Test folders without a CI shard: $($missing.Name -join ', ')"; exit 1 }

  tests:
    # Two shards of about the same run time (~75 s each, measured 27.09.) instead of one ~150 s run.
    name: Pester tests ${{ matrix.shard }} (PowerShell 5.1)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-api
            paths: tests\core,tests\api,tests\output,tests\arcade
          - shard: pinball-lightgun-gui
            paths: tests\pinball,tests\lightgun,tests\gui,tests\pads
    steps:
      - uses: actions/checkout@v7
      - name: Provide the synthetic test drives E and X
        shell: powershell
        run: |
          # Test fixtures plan paths on the synthetic drives E and X (nothing is written there). PowerShell 5.1 resolves
          # paths only on existing drives, so the letters must exist, as they do on a developer machine with more drives.
          foreach ($letter in 'E', 'X') {
            if (-not (Test-Path "${letter}:\")) {
              $dir = Join-Path $env:RUNNER_TEMP "drive-$letter"
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
              subst "${letter}:" $dir
            }
          }
      - name: Run tests\Run-Tests.ps1
        shell: powershell
        env:
          TEST_PATHS: ${{ matrix.paths }}
        run: |
          .\tests\Run-Tests.ps1 -Path ($env:TEST_PATHS -split ',')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dashboard snapshots for review (sample status, nothing is read from the runner)
        if: always() && matrix.shard == 'pinball-lightgun-gui'
        shell: powershell
        run: |
          # The GUI module loads the core for itself; the rows below need the core in this session too.
          Import-Module .\core\RetroCabinetKit.Core.psd1
          Import-Module .\gui\RetroCabinetKit.Gui.psd1
          $rows = @(
            New-KitCheckResult -Area 'System' -Name 'Windows' -Level Ok -Detail 'Windows 11 (build 26100)'
            New-KitCheckResult -Area 'Pinball' -Name 'Build' -Level Ok
            New-KitCheckResult -Area 'Lightgun' -Name 'DolphinBar' -Level Warn -Detail 'Connected in Mode12: switch it to Mode 4 (step 2).'
            New-KitCheckResult -Area 'Security' -Name 'Profile automation folder' -Level Ok
          )
          foreach ($culture in 'en-US', 'de-DE') {
            .\gui\Start-KitGui.ps1 -Culture $culture -DoctorResult $rows -Screenshot "snapshots\dashboard-$culture.png"
            .\gui\Start-KitGui.ps1 -Culture $culture -DoctorResult $rows -View Migrate -Screenshot "snapshots\migrate-$culture.png"
          }
      - name: Print snapshots into the log (opt-in with [snapshot-log] in the commit message)
        if: matrix.shard == 'pinball-lightgun-gui' && contains(github.event.head_commit.message, '[snapshot-log]')
        shell: powershell
        run: |
          # For reviewers without access to artifact storage: base64 between markers, 4000 characters per line.
          foreach ($f in Get-ChildItem snapshots\*.png) {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            "SNAPSHOT-BEGIN $($f.Name)"
            for ($i = 0; $i -lt $b.Length; $i += 4000) { $b.Substring($i, [Math]::Min(4000, $b.Length - $i)) }
            "SNAPSHOT-END $($f.Name)"
          }
      - uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 'pinball-lightgun-gui'
        with:
          name: dashboard-snapshots
          path: snapshots/
          retention-days: 14

  package:
    name: Package build and integrity
    needs: [depersonalization, static, tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build release zip
        shell: powershell
        run: .\tools\New-ReleasePackage.ps1 -DestinationDir dist
      - name: Verify release zip
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\frieds-retrogaming-kit-v*.zip | Select-Object -First 1
          .\tools\Test-ReleasePackage.ps1 -ZipPath $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: frieds-retrogaming-kit-${{ github.sha }}
          path: dist/
          retention-days: 14

  site:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /frieds-retrogaming-kit/
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/dist

  pages:
    # Deploys the website built in "site", only from main and only after every other job is green.
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [site, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
